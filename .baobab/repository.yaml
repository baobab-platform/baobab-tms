# Foundation repository classification only; NOT CP/provider registration.
# ADR-TMS-0001/0020/0021: Node 24 headless kernel; hybrid native providers
# remain separate and uncertified. Experimental lifecycle is intentional.
schema_version: 1
repository:
  lifecycle: experimental
capabilities:
  - engine
  - node
  - documentation
  - github-actions
environment:
  baobab_dev:
    required: true
    profile: full
package_managers:
  node: npm
artifacts:
  # A Dev Container is not a releasable TMS runtime image.
  container: false
security:
  # TMS is public with JavaScript supported by CodeQL; Foundation owns SAST.
  sast_provider: codeql
