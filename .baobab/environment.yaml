# DEV-10 development-toolchain contract; never a CP CapabilityProvider claim.
# Native Fleetbase (MySQL) and Open TMS (PostgreSQL) are distinct HYB runtimes.
schema:
  name: "baobab-platform-development-environment-contract"
  version: "1.0"
application:
  name: "baobab-tms"
  version: "0.1.0-foundation.1"
environment:
  provider: "baobab-dev"
  profile: "full"
  minimum_version: "1.4.4"
  contract_minimum_version: "1.0"
compatibility_policy:
  strict_runtime_versions: true
  allow_newer_patch_versions: true
  allow_newer_minor_versions: false
  allow_older_versions: false
validation:
  required_capabilities:
    - "languages.node"
    - "database.postgresql"
    - "development.docker"
    - "development.github_cli"
notes:
  - "The first-party foundation is Node 24 with no third-party npm runtime dependencies. Docker/PG17 client tooling supports owner-led HYB/PG17 development tests; it does not start or certify native providers."
  - "Fleetbase/Fleet-Ops native MySQL and Open TMS PG17 remain isolated, optional owner test profiles with distinct credentials and authority."
