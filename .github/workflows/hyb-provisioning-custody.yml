name: TMS HYB-03 Provisioning Custody
on:
  pull_request:
    paths:
      - "src/governance/**"
      - "db/migrations/0003_native_provisioning_custody.sql"
      - "scripts/hybrid/verify-native-provisioning-ledger.py"
      - "test/native-provisioning-plan.test.mjs"
      - ".github/workflows/hyb-provisioning-custody.yml"
  push:
    branches: [main]
    paths:
      - "src/governance/**"
      - "db/migrations/0003_native_provisioning_custody.sql"
      - "scripts/hybrid/verify-native-provisioning-ledger.py"
      - "test/native-provisioning-plan.test.mjs"
      - ".github/workflows/hyb-provisioning-custody.yml"
  workflow_dispatch:
env:
  COMPOSE_PROJECT_NAME: tms-audit-${{ github.run_id }}-${{ github.run_attempt }}
permissions:
  contents: read
jobs:
  tms-draft-and-pg17:
    name: HYB-03 TMS draft + actual PG17 deny-all operation custody
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: Checkout TMS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Run adversarial no-activation lifecycle tests
        run: |
          node --check src/governance/native-provisioning-plan.mjs
          node --test test/native-provisioning-plan.test.mjs
      - name: Generate ephemeral database credentials
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          file="$RUNNER_TEMP/hyb03-db.env"
          : > "$file"
          for name in HYB_MYSQL_A_ROOT HYB_MYSQL_B_ROOT HYB_MYSQL_A_APP HYB_MYSQL_B_APP HYB_PG_A_ROOT HYB_PG_B_ROOT HYB_PG_A_APP HYB_PG_B_APP; do
            printf '%s=%s\n' "$name" "$(openssl rand -hex 24)" >> "$file"
          done
          echo "HYB03_ENV=$file" >> "$GITHUB_ENV"
      - name: Launch isolated PostgreSQL 17
        shell: bash
        run: |
          docker compose --env-file "$HYB03_ENV" \
            -f ops/hybrid/docker-compose.data-plane.yml up -d --wait postgres_a
      - name: Execute all canonical migrations against real PG17
        shell: bash
        run: |
          set -euo pipefail
          for file in db/migrations/0001_foundation.sql db/migrations/0002_native_worker_execution.sql db/migrations/0003_native_provisioning_custody.sql; do
            docker compose --env-file "$HYB03_ENV" \
              -f ops/hybrid/docker-compose.data-plane.yml exec -T postgres_a \
              psql -U postgres -d opentms_a -v ON_ERROR_STOP=1 < "$file"
          done
      - name: Verify scoped provisioning ledger denies native runtime reads and writes
        run: python3 scripts/hybrid/verify-native-provisioning-ledger.py "$HYB03_ENV"
      - name: Destroy synthetic credentials, containers and volumes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/hyb03-db.env"
          trap 'rm -f "$file"' EXIT
          if [ -f "$file" ]; then
            docker compose --env-file "$file" -f ops/hybrid/docker-compose.data-plane.yml down -v --remove-orphans
            test -z "$(docker ps -aq --filter label=com.docker.compose.project=$COMPOSE_PROJECT_NAME)"
            test -z "$(docker volume ls -q --filter label=com.docker.compose.project=$COMPOSE_PROJECT_NAME)"
            test -z "$(docker network ls -q --filter label=com.docker.compose.project=$COMPOSE_PROJECT_NAME)"
            rm -f "$file"
          fi
