# ADR-TMS-0001/0002/0020/0021: executable Foundation-1 smoke.
# Self-contained Node 24 only. Does not confer CP/EA-09 provider certification.
name: TMS Foundation
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
      - "package.json"
      - "db/**"
      - ".baobab/capability-provider.yaml"
      - ".github/workflows/tms-foundation.yml"
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "package.json"
      - "db/**"
      - ".baobab/capability-provider.yaml"
      - ".github/workflows/tms-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Verify syntax and adversarial foundation tests
        run: npm run check
      - name: Checkout exact Shared contract revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: baobab-platform/shared
          ref: 2986b7c1c884f0556d8e0dac523f2bceb27646c1
          path: .shared
          persist-credentials: false
      - name: Set up Shared contract validator
        uses: actions/setup-python@06da6279cdbca41027908073e81a4544dc79c06b # v7.0.0
        with:
          python-version: "3.13"
      - name: Validate planned provider declaration against Shared
        run: |
          python -m pip install --disable-pip-version-check -r .shared/.github/foundation-tests/requirements.txt
          python .shared/scripts/capability_catalogue.py \
            --contracts-root .shared/contracts \
            validate-declaration .baobab/capability-provider.yaml \
            --engine-id baobab-tms --repository-root .
      - name: Guard against false provider activation
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq '^[[:space:]]*providers:' .baobab/capability-provider.yaml; then
            echo "A real provider declaration requires independent EA-09 proof" >&2
            exit 1
          fi
          grep -q 'proposal_status: CANDIDATE' .baobab/capability-provider.yaml
          grep -q 'no live provider' docs/implementation/FND-01.md
